# WSCC 3 機 9 母線系統（授業用拡張版）
#
# 系統データ（母線・線路・変圧器・負荷・慣性定数 H・過渡リアクタンス x'd）の出典:
#   P. M. Anderson and A. A. Fouad, "Power System Control and Stability",
#   2nd ed., IEEE Press, 2003, Chapter 2.
#
# 以下は原典になく、**教材用に著者が設定した自作の値**である。
# 詳細と設計根拠は docs/model_assumptions.md を参照すること。
#   - 母線種別と設定電圧（原典の潮流解と整合するよう決めた）
#   - 線路の熱容量 rate_a / rate_b（交流の N-1 潮流から逆算。
#     tools/design_ratings.py で再現できる）
#   - 発電機を号機に分解した諸元（容量・燃料費・最低運転停止時間・FOR）
#   - 制動係数 D = 2.0（原典は D = 0）
#   - 24 時間の需要形状と太陽光出力（合成データ）
#
# 単位: ネットワーク量は p.u.（100 MVA 基準）、費用と容量は MW / 円。
#       キーの _mw 接尾辞がその目印。

schema: 2
name: WSCC 3-machine 9-bus system (course edition)
base_mva: 100.0
frequency_hz: 60.0
source: >-
  P. M. Anderson and A. A. Fouad, Power System Control and Stability,
  2nd ed., IEEE Press, 2003, Chapter 2.
modifications: >-
  母線種別・熱容量・号機分解・燃料費・信頼度データ・時系列需要は
  原典になく、教材用に設定した自作の値である。制動係数は原典の
  D = 0 から D = 2.0 に変えている。

# ======================================================================
# network 層 — 第 01 回〜。潮流計算の「入力」だけを置く。
#
# 未知数の数合わせ:
#   slack 1 母線, PV 2 母線, PQ 6 母線
#   未知数 = 2 * n_PQ + n_PV = 2*6 + 2 = 14
#   方程式 = P 方程式 (n_PV + n_PQ = 8) + Q 方程式 (n_PQ = 6) = 14
# ======================================================================
buses:
  - {id: 1, type: slack, v_set: 1.0400, name: G1 bus}
  - {id: 2, type: pv,    v_set: 1.0250, name: G2 bus}
  - {id: 3, type: pv,    v_set: 1.0250, name: G3 bus}
  - {id: 4, type: pq}
  - {id: 5, type: pq, pd: 1.25, qd: 0.50, name: Load A}
  - {id: 6, type: pq, pd: 0.90, qd: 0.30, name: Load B}
  - {id: 7, type: pq}
  - {id: 8, type: pq, pd: 1.00, qd: 0.35, name: Load C}
  - {id: 9, type: pq}

voltage_limits: {v_min: 0.95, v_max: 1.05}

# r, x: 直列インピーダンス [p.u.] / b: 全充電サセプタンス [p.u.]
# rate_a: 常時許容容量 |S| [p.u.] / rate_b: 緊急時許容容量 |S| [p.u.]
#
# ※ rate は皮相電力 |S| の制限であって、直流潮流の有効電力 P ではない。
#    枝 4-5 では交流の |S| が直流の P より 47.6% 大きい（0.5614 対 0.3803）。
#    熱容量の判定を直流潮流で行ってはいけない。
branches:
  - {from: 1, to: 4, x: 0.0576, rate_a: 2.00, rate_b: 2.40, name: T1}
  - {from: 2, to: 7, x: 0.0625, rate_a: 2.00, rate_b: 2.40, name: T2}
  - {from: 3, to: 9, x: 0.0586, rate_a: 2.00, rate_b: 2.40, name: T3}
  - {from: 4, to: 5, r: 0.0100, x: 0.0850, b: 0.176, rate_a: 1.00, rate_b: 1.50}
  - {from: 4, to: 6, r: 0.0170, x: 0.0920, b: 0.158, rate_a: 0.80, rate_b: 1.20}
  - {from: 5, to: 7, r: 0.0320, x: 0.1610, b: 0.306, rate_a: 1.10, rate_b: 1.45}
  - {from: 6, to: 9, r: 0.0390, x: 0.1700, b: 0.358, rate_a: 1.10, rate_b: 1.65}
  - {from: 7, to: 8, r: 0.0085, x: 0.0720, b: 0.149, rate_a: 1.10, rate_b: 1.45}
  - {from: 8, to: 9, r: 0.0119, x: 0.1008, b: 0.209, rate_a: 0.80, rate_b: 1.20}

# ======================================================================
# units 層 — 号機。原典の 3 機のままでは起動停止の意思決定がほぼ自明で、
# 最低運転停止時間も効かず、アデカシーの状態数も足りない。7 号機に分ける。
#
# 各号機の h は 100 MVA 共通基準へ換算済みの慣性寄与分として定義している。
# この寄与分は加算でき、過渡リアクタンスは並列合成で原典の 3 機に戻る。
# （gridops.interop.to_genstab が行う）:
#   G1: 3 台 x H=7.880, x'd=0.1824  ->  H=23.64, x'd=0.0608
#   G2: 2 台 x H=3.200, x'd=0.2396  ->  H= 6.40, x'd=0.1198
#   G3: 2 台 x H=1.505, x'd=0.3626  ->  H= 3.01, x'd=0.1813
#
# 設備容量 460 MW / 最大需要 315 MW -> 設備予備率 46%
# 同一発電所内で燃料費をわずかにずらしてあるのは、混合整数計画の解が
# 縮退して入切表がソルバの版で変わるのを避けるためで、物理的な意味はない。
# ======================================================================
units:
  # --- 母線 1: 石炭。安いが起動が遅く、最低運転時間が長い ---------------
  - {name: G1-1, bus: 1, plant: G1, p_max_mw: 60, p_min_mw: 24,
     var_cost:  8000, quadratic: 12.0, noload_cost:  90000,
     startup_cost: 1200000, min_up: 8, min_down: 8,
     ramp_up: 20, ramp_down: 20, u0: 1, hours_in_state: 24,
     forced_outage_rate: 0.04, mttf: 1200.0, mttr: 50.0,
     q_min: -0.60, q_max: 1.20, h: 7.880, xd_prime: 0.1824, d: 2.0}
  - {name: G1-2, bus: 1, plant: G1, p_max_mw: 60, p_min_mw: 24,
     var_cost:  8100, quadratic: 12.0, noload_cost:  90000,
     startup_cost: 1200000, min_up: 8, min_down: 8,
     ramp_up: 20, ramp_down: 20, u0: 1, hours_in_state: 24,
     forced_outage_rate: 0.04, mttf: 1200.0, mttr: 50.0,
     q_min: -0.60, q_max: 1.20, h: 7.880, xd_prime: 0.1824, d: 2.0}
  - {name: G1-3, bus: 1, plant: G1, p_max_mw: 60, p_min_mw: 24,
     var_cost:  8200, quadratic: 12.0, noload_cost:  90000,
     startup_cost: 1200000, min_up: 8, min_down: 8,
     ramp_up: 20, ramp_down: 20, u0: 0, hours_in_state: 24,
     forced_outage_rate: 0.04, mttf: 1200.0, mttr: 50.0,
     q_min: -0.60, q_max: 1.20, h: 7.880, xd_prime: 0.1824, d: 2.0}
  # --- 母線 2: LNG コンバインドサイクル。中位の費用、起動が速い ---------
  - {name: G2-1, bus: 2, plant: G2, p_max_mw: 90, p_min_mw: 36,
     var_cost: 12000, quadratic: 8.0, noload_cost: 60000,
     startup_cost: 400000, min_up: 4, min_down: 4,
     ramp_up: 45, ramp_down: 45, u0: 1, hours_in_state: 12,
     forced_outage_rate: 0.05, mttf: 950.0, mttr: 50.0,
     q_min: -0.60, q_max: 1.00, h: 3.200, xd_prime: 0.2396, d: 2.0}
  - {name: G2-2, bus: 2, plant: G2, p_max_mw: 90, p_min_mw: 36,
     var_cost: 12500, quadratic: 8.0, noload_cost: 60000,
     startup_cost: 400000, min_up: 4, min_down: 4,
     ramp_up: 45, ramp_down: 45, u0: 1, hours_in_state: 12,
     forced_outage_rate: 0.05, mttf: 950.0, mttr: 50.0,
     q_min: -0.60, q_max: 1.00, h: 3.200, xd_prime: 0.2396, d: 2.0}
  # --- 母線 3: LNG 汽力。高いが起動停止が軽い（ピーク対応）--------------
  - {name: G3-1, bus: 3, plant: G3, p_max_mw: 50, p_min_mw: 15,
     var_cost: 20000, quadratic: 20.0, noload_cost: 25000,
     startup_cost: 120000, min_up: 2, min_down: 2,
     ramp_up: 40, ramp_down: 40, u0: 1, hours_in_state: 6,
     forced_outage_rate: 0.07, mttf: 664.0, mttr: 50.0,
     q_min: -0.50, q_max: 0.80, h: 1.505, xd_prime: 0.3626, d: 2.0}
  - {name: G3-2, bus: 3, plant: G3, p_max_mw: 50, p_min_mw: 15,
     var_cost: 20500, quadratic: 20.0, noload_cost: 25000,
     startup_cost: 120000, min_up: 2, min_down: 2,
     ramp_up: 40, ramp_down: 40, u0: 0, hours_in_state: 12,
     forced_outage_rate: 0.07, mttf: 664.0, mttr: 50.0,
     q_min: -0.50, q_max: 0.80, h: 1.505, xd_prime: 0.3626, d: 2.0}

# ======================================================================
# commitment 層 — 第 07 回〜。
#
# peak_mw = 315 MW は基準潮流の総負荷（1.25 + 0.90 + 1.00 = 3.15 p.u.）に
# 一致させてある。allocation は母線への配分比で、負荷形状を掛けた値を
# 各母線に振り分けるのに使う。
# ======================================================================
commitment:
  peak_mw: 315.0
  reserve_rate: 0.10
  allocation: {5: 0.396825, 6: 0.285714, 8: 0.317460}
  profiles:
    summer_weekday: [0.72, 0.68, 0.66, 0.65, 0.67, 0.72, 0.82, 0.90,
                     0.95, 0.97, 0.96, 0.93, 0.90, 0.92, 0.95, 0.97,
                     1.00, 0.99, 0.95, 0.90, 0.86, 0.82, 0.78, 0.75]
    winter_weekday: [0.78, 0.75, 0.73, 0.73, 0.76, 0.84, 0.95, 1.00,
                     0.97, 0.93, 0.90, 0.88, 0.86, 0.86, 0.88, 0.92,
                     0.97, 1.00, 0.98, 0.94, 0.90, 0.87, 0.84, 0.81]
    light_load:     [0.55, 0.52, 0.50, 0.49, 0.50, 0.54, 0.60, 0.66,
                     0.70, 0.72, 0.72, 0.70, 0.68, 0.69, 0.71, 0.73,
                     0.76, 0.78, 0.76, 0.72, 0.68, 0.64, 0.60, 0.57]
  # 第 08 回の純需要（ダックカーブ）用。合成データ。
  vre:
    name: PV
    capacity_mw: 120.0
    profile: [0, 0, 0, 0, 0, 0.02, 0.12, 0.30, 0.50, 0.68, 0.82, 0.90,
              0.92, 0.88, 0.78, 0.62, 0.42, 0.20, 0.05, 0, 0, 0, 0, 0]

# ======================================================================
# reliability 層 — 第 10 回。強制停止率は units 側に置いてあるので、
# ここには年間需要の生成パラメータだけを置く。8760 時間の実需要は
# 第三者データなので同梱せず、seed 固定の生成関数で合成する。
# ======================================================================
reliability:
  annual:
    seed: 0
    seasonal_amplitude: 0.18
    weekend_factor: 0.88
    noise_sigma: 0.03
  rounding_mw: 5.0
  target_lole_hours: 3.0        # 教材用の目標値であって制度の基準値ではない

# ======================================================================
# stability 層 — genstab へそのまま渡す。母線 7 で三相地絡し、
# 線路 5-7 を開放して除去する標準的なケース。
#
# ※ この 5-7 の開放は、下の contingencies に挙げた N-1 候補の 1 つでも
#    ある。同じ 1 つの事象を第 09 回で静的に（過負荷）、genstab の
#    第 08 回で動的に（脱調）評価することになる。
# ======================================================================
stability:
  fault:
    t_fault: 1.0
    t_clear: 1.0833            # 5 サイクル (60 Hz)
    buses: [7]
    tripped_branches:
      - {from: 5, to: 7}
  protection_time: 0.080       # 保護動作時間の目安 [s]

# ======================================================================
# N-1 の想定事故。変圧器 3 本（1-4, 2-7, 3-9）は開放すると発電機母線が
# 島になるので候補に含めていない。この事実は Case.check() と
# gridops.ybus.bridges() が自分で検出するので、第 09 回では
# 「なぜこの 3 本が外れているのか」を学生に答えさせる。
# ======================================================================
contingencies:
  branches: [{from: 4, to: 5}, {from: 4, to: 6}, {from: 5, to: 7},
             {from: 6, to: 9}, {from: 7, to: 8}, {from: 8, to: 9}]

# ======================================================================
# solution 層 — 教科書の潮流解。**入力ではない。答え合わせにだけ使う。**
#
# Anderson & Fouad Chapter 2 の掲載値（位相は小数 4 桁で丸められている）。
# 自力の Newton-Raphson 解との差は |V| で 4.7e-5、位相で 4.9e-5 deg に
# 収まる。これは掲載桁数で決まる丸めであって、誤りではない。
# ======================================================================
solution:
  source: "Anderson & Fouad (2003) Ch.2 の事故前潮流解"
  digits: 4
  buses:
    - {id: 1, v: 1.0400, angle_deg:  0.0000}
    - {id: 2, v: 1.0250, angle_deg:  9.2800}
    - {id: 3, v: 1.0250, angle_deg:  4.6648}
    - {id: 4, v: 1.0258, angle_deg: -2.2168}
    - {id: 5, v: 0.9956, angle_deg: -3.9888}
    - {id: 6, v: 1.0127, angle_deg: -3.6874}
    - {id: 7, v: 1.0258, angle_deg:  3.7197}
    - {id: 8, v: 1.0159, angle_deg:  0.7275}
    - {id: 9, v: 1.0324, angle_deg:  1.9667}
  generation:
    - {bus: 1, p: 0.716, q:  0.270}
    - {bus: 2, p: 1.630, q:  0.067}
    - {bus: 3, p: 0.850, q: -0.109}
  # 独立に確かめられる量。テストの期待値をケース側に持たせている。
  checks:
    losses_pu: 0.046410
    slack_p: 0.716410
    slack_q: 0.270459
    internal_emf: [1.0566, 1.0502, 1.0170]
    internal_angle_deg: [2.2717, 19.7315, 13.1752]
