name: robust final course cleanup

permissions:
  contents: write

on:
  push:
    branches:
      - fix/course-material-review-20260830

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-material-review-20260830
          fetch-depth: 0

      - name: 残った番号・用語・概念説明を修正する
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/_final_course_cleanup.py")
          text = path.read_text(encoding="utf-8")
          block = '''replace_once(
              "docs/references.md",
              "    本教材の第 10 回はこの本に従っています。",
              "    本教材の第 18 回はこの本に従っています。",
          )
          '''
          if block not in text:
              raise SystemExit("reference-number cleanup block was not found")
          path.write_text(text.replace(block, "", 1), encoding="utf-8")
          PY
          python tools/_final_course_cleanup.py
          python -m compileall -q src tools tests
          git diff --stat

      - name: conda 環境を作る
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: pwsyseng
          miniforge-version: latest
          auto-activate-base: false

      - name: Notebookを再生成して検証する
        env:
          MPLBACKEND: Agg
          GRIDOPS_FAST: "1"
        run: |
          pip install -e .
          python tools/build_notebooks.py
          python tools/check_case.py
          pytest -q
          outdir="${RUNNER_TEMP}/final-notebooks"
          mkdir -p "$outdir"
          for nb in \
            notebooks/00_setup.ipynb \
            notebooks/08_reserve_and_vre.ipynb \
            notebooks/18_adequacy.ipynb \
            notebooks/19_integrated.ipynb; do
            jupyter nbconvert --to notebook --execute --output-dir="$outdir" "$nb"
          done

      - name: 恒久的な変更をpushする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .github/workflows/final_course_cleanup2.yml \
            tools/_final_course_cleanup.py
          git commit -m "fix: complete course numbering and terminology cleanup"
          git push origin HEAD:fix/course-material-review-20260830
