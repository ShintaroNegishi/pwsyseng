[build-system]
requires = ["setuptools>=77"]   # PEP 639 の license = "MIT" 形式に必要
build-backend = "setuptools.build_meta"

[project]
name = "pwsyseng"
version = "0.1.0"
description = "Power system engineering course toolkit: operation, planning, and stability"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# メールアドレスを載せる場合は email = "..." を追加する。
authors = [{ name = "Shintaro Negishi" }]
keywords = [
    "power-flow",
    "economic-dispatch",
    "unit-commitment",
    "reliability",
    "transient-stability",
    "small-signal-stability",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "control>=0.9.4",
    "pyyaml>=6.0",
    "pulp>=2.7",
]

# この 1 つの配布物から genstab（安定度）と gridops（運用・計画）の
# 2 つのパッケージが入る。slycot は依存に含めていない。pip からの
# インストールは Fortran のビルドが必要で失敗しやすいため、conda-forge
# から入れる前提にしている（environment.yml を参照）。

[project.optional-dependencies]
notebook = ["jupyterlab", "ipywidgets", "pandas", "sympy", "nbformat"]
dev = ["pytest>=7.0", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridops = ["casedata/*.yaml", "casedata/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
